#:schema https://developers.openai.com/codex/config-schema.json

# devcontainer 自体が自律エージェント実行の隔離境界。
# 書き込みはチェックアウト済みワークスペースに限定しつつ、エスカレーションされた
# 承認要求は人間ではなく自動レビューへ回す（CLI の `--approve-for-me` 相当）。
# 承認を一切求めない `approval_policy = "never"` と違い、サンドボックス外への
# 書き込みやネットワーク遮断などの逸脱はリスク評価を経てから許可/拒否される。
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
project_doc_max_bytes = 65536

[sandbox_workspace_write]
network_access = true

[projects."/workspace"]
trust_level = "trusted"

# コンテナ内の headless Chromium で画面の見た目をデバッグするための Chrome DevTools MCP。
# 本体は post-create.sh でグローバルインストール、Chromium は Dockerfile の devcontainer ステージで導入。
[mcp_servers.chrome-devtools]
command = "chrome-devtools-mcp"
args = ["--headless", "--isolated", "--no-usage-statistics", "--executablePath", "/usr/local/bin/chromium-no-sandbox"]
