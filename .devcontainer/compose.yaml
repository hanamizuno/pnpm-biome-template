# devcontainer 用 compose 定義。devcontainer.json の dockerComposeFile から
# compose.local.yaml（gitignore、ローカルオーバーライド）とマージして使われる。
# ルートの compose.yml / compose.dev.yml とは別物。
# project directory はこのファイルのあるディレクトリ（.devcontainer/）なので、
# 相対パスは .devcontainer/ 基準で書く。
name: pnpm-biome-template-devcontainer
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: devcontainer
    # compose ベースの devcontainer は overrideCommand が効かないため自前で維持する
    command: sleep infinity
    user: vscode
    volumes:
      - ..:/workspace:cached
      - claude-config:/home/vscode/.claude
      - codex-config:/home/vscode/.codex
      - gh-config:/home/vscode/.config/gh
      - agent-history:/commandhistory
      # bind mount 上のホスト側 node_modules をコンテナ内でマスクする
      # （ホスト macOS / コンテナ Linux でネイティブバイナリが混ざらないように）
      - node-modules:/workspace/node_modules
      - pnpm-store:/home/vscode/.pnpm-store
      # Proton Pass: pass-cli のログインセッションを rebuild 越しに保つ volume。
      # PAT 自体は git-ignore の .devcontainer/host-proton-pat ステージ経由で届く
      # (ワークスペースマウント内。post-start.sh が pass-relogin 用に
      # ~/.local/state/proton-pass-agent/pat へ永続化してからステージを削除)。
      # environment / remoteEnv で渡さないこと (コンテナ metadata /
      # docker inspect に残る)。単一ファイルの bind mount にもしないこと
      # (initializeCommand がスキップされる環境 — Git Bash の無い Windows — で
      # 起動が壊れる)。
      - proton-pass:/home/vscode/.local/state/proton-pass
    environment:
      HISTFILE: /commandhistory/.bash_history
      PROMPT_COMMAND: history -a
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
volumes:
  claude-config:
  codex-config:
  gh-config:
  agent-history:
  node-modules:
  pnpm-store:
  proton-pass:
