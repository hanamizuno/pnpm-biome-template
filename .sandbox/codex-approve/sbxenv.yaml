# Docker Sandboxes の環境ファイル: Codex を approve-for-me モードで起動する。
#
# 組み込み codex kit の既定起動コマンドは
# `codex --dangerously-bypass-approvals-and-sandbox`（= 承認もサンドボックスも無し）。
# `sbx run codex -- <args>` は既定フラグの「後ろに追加」されるだけで打ち消せず、
# v3 kit には fork（extends）も無いため、環境ファイルの entrypoint / cmd で
# `sbx env run` の起動コマンドを丸ごと置き換える。
#
# 使い方（ホスト側、リポジトリの checkout から）:
#   sbx env run ./.sandbox/codex-approve
#
# entrypoint / cmd が効くのは `sbx env run` だけ。`sbx run` / `sbx env exec` で
# 入ると既定の YOLO 起動になるので、再接続も必ず `sbx env run` で行う。
# 詳細は /docs/knowledge/runbooks/agent-sandbox-sbx.md「YOLO 既定の上書き」。
#
# --approve-for-me は workspace-write サンドボックスを保ったまま、エスカレーション
# された承認要求を人間ではなく自動レビューへ回すモード。組み込み codex kit が
# seed する ~/.codex/config.toml は approval_policy = "never" /
# sandbox_mode = "danger-full-access" なので、この起動フラグが唯一の歯止めになる。
#
# name は書かない — sandbox 名は `codex-<checkout のディレクトリ名>` になる。
schemaVersion: "1"
agent: codex
kits:
  - ../kit
workspace:
  # 環境ファイルの場所から解決される相対パス（= リポジトリルート）
  path: ../..
  # 必須（同「clone モードで運用する」）
  clone: true
# entrypoint と cmd の両方を明示して、組み込み kit の既定（bypass フラグ）を
# 一切継承しない。
entrypoint: [codex]
cmd: [--approve-for-me]
