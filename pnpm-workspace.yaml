# リリース直後の供給チェーン攻撃を避けるため、公開から 7 日未満のバージョンは解決しない
# （.github/dependabot.yml の cooldown.default-days: 7 と揃える。単位: 分）
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true

# pnpm は .npmrc から auth / registry 設定しか読まないため、これらはここに置く
# （旧 .npmrc の auto-install-peers / engine-strict / strict-peer-dependencies）
autoInstallPeers: true
engineStrict: true
strictPeerDependencies: false
