name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/scripts/sync-labels.sh"
      - ".github/workflows/labels.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/scripts/sync-labels.sh"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions: {}

# ラベル変更はミューテーションのため直列化する（途中キャンセルしない）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: bash .github/scripts/sync-labels.sh .github/labels.yml
