name: Generate SBOM

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SBOM (CycloneDX)
        # cdxgen は pnpm-lock.yaml を解析して CycloneDX SBOM を生成する。再現性のためバージョン固定
        run: pnpm dlx @cyclonedx/cdxgen@12.7.0 -t pnpm -o sbom.cdx.json .

      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
