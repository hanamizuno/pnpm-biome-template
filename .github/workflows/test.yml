name: Test and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # 24 = 現行 LTS、25 = current (odd release)
        node-version: [24, 25]

    env:
      FORCE_COLOR: "0"
      NO_COLOR: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          pnpm test:cov 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        # 1 マトリクスのみアップロード（メイン LTS）
        if: matrix.node-version == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

      - name: Add comment to PR
        # fork からの PR は GITHUB_TOKEN が read-only でコメントできないためスキップ
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && matrix.node-version == 24
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");

            const runURL = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const downloadLink = `[HTMLレポートをArtifactsからダウンロード](${runURL})`;

            // vitest の json-summary レポーター出力から Markdown 表を組み立てる
            const summaryPath = "coverage/coverage-summary.json";
            const metrics = ["statements", "branches", "functions", "lines"];
            const fmt = (m) => {
              const pct = typeof m.pct === "number" ? `${m.pct.toFixed(2)}%` : "-";
              return `${pct} (${m.covered}/${m.total})`;
            };
            const row = (name, entry) =>
              `| ${name} | ${metrics.map((k) => fmt(entry[k])).join(" | ")} |`;

            let reportSection = "\n\nカバレッジデータがありません。";
            if (fs.existsSync(summaryPath)) {
              const { total, ...files } = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
              const fileRows = Object.entries(files)
                .map(([file, entry]) => [path.relative(process.cwd(), file), entry])
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([file, entry]) => row(`\`${file}\``, entry));
              const table = [
                "| File | Statements | Branches | Functions | Lines |",
                "| :--- | ---: | ---: | ---: | ---: |",
                row("**All files**", total),
                ...fileRows,
              ].join("\n");
              reportSection = `\n\n${table}`;
            }
            const marker = "## テストカバレッジレポート";
            const body = `${marker}\n\n${downloadLink}${reportSection}`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && (c.body ?? "").startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
