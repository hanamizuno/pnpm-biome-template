repos:
  - repo: local
    hooks:
      - id: biome-format
        name: biome format
        entry: pnpm biome format --check
        language: system
        pass_filenames: false
      - id: biome-lint
        name: biome lint
        entry: pnpm biome lint
        language: system
        pass_filenames: false
      - id: typecheck
        name: tsc --noEmit
        entry: pnpm typecheck
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$
      - id: secretlint
        name: secretlint
        entry: pnpm exec secretlint
        language: system
        pass_filenames: true
