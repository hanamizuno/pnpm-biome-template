# zizmor configuration file
# GitHub Actions security scanner configuration

rules:
  unpinned-uses:
    config:
      # すべてのアクションを commit hash（docker は digest）で固定する。
      # .github/workflows/actions.lock で固定されたタグ参照も pin 済みとして扱われる
      # （zizmor 1.32.0+。lockfile を外すと unpinned-uses になる）
      policies:
        "*": hash-pin
